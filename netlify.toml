[build]
  base = "web"
  command = "node -e \"const r=process.env.DATABASE_URL||'';const s=r.trim().replace(/^['\\\"]|['\\\"]$/g,'');console.log('DBURL len='+r.length+' trimmed='+s.length+' head='+JSON.stringify(s.slice(0,20))+' scheme_ok='+(s.startsWith('postgresql://')||s.startsWith('postgres://')))\" && npx prisma generate && npm run db:deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js App Router + API routes run as Netlify Functions/Edge automatically
# Add env vars in Netlify Dashboard or via CLI - never commit secrets here
